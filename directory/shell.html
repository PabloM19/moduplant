</ul></nav></div><dialog aria-labelledby="website-credits-title" id="website-credits"><div class="modal-shell"><button aria-label="Cerrar ventana" class="modal-close icon-button">×</button><span class="eyebrow">PROCEDENCIA Y USO</span><h2 id="website-credits-title">Detrás de lo que ves.</h2><p>Las dos escenas de garden se han creado para esta propuesta con generación de imagen. Son ilustraciones fotográficas: no representan centros, clientes ni miembros del equipo reales.</p><p>Logos de HerbaQuiz, ModuPlant, Green Calendar y FirmaPet: archivos originales aportados en Herramientas_logos. Piezas de comunicación propias: archivo local green_ig. Materiales de interfaz de HerbaQuiz: diseños propios recuperados de Canva (DAG5_L0uQ7Q y DAHAWTPfn1A). Se muestran como archivo de proyecto, sin atribuir resultados ni disponibilidad actual.</p><p>Instrument Sans y Newsreader: fuentes locales con licencia OFL. Ilustraciones grandes: SVG originales creados para Green Digital. Pequeños iconos de interfaz: Lucide, con licencia incluida. Logo Green Digital provisional.</p><p>Los retratos del equipo están pendientes: se han reservado espacios, sin sustituir a las personas por imágenes generadas. El paquete no contiene fotografías de Langton ni Fröschl. La referencia interna de identidad se conserva fuera de este prototipo.</p></div></dialog></div>
